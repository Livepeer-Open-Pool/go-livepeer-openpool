# The three sites of Open Pool, each a small web server holding built files.
# It builds nothing: the images come from a registry, by the tags in .env.
# Traefik, which is not part of this file, routes to each by its labels.
#
#   cp .env.example .env                  and fill it in
#   cp config.example.json config.json    and name your regions
#   docker compose up -d
#
# config.json is read by the browser each time a site is opened, so adding a
# region is editing that file: nothing is rebuilt or restarted.
name: openpool-sites

x-site: &site
  restart: unless-stopped
  networks: [traefik]
  volumes:
    - ./config.json:/usr/share/nginx/html/config.json:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/config.json"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s
    start_interval: 1s

services:
  marketing:
    <<: *site
    image: ${MARKETING_IMAGE}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.openpool-marketing.rule=Host(`${MARKETING_SITE_HOST}`)
      - traefik.http.routers.openpool-marketing.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.openpool-marketing.tls=true
      - traefik.http.routers.openpool-marketing.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.openpool-marketing.service=openpool-marketing
      - traefik.http.services.openpool-marketing.loadbalancer.server.port=8080

  member:
    <<: *site
    image: ${MEMBER_IMAGE}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.openpool-member.rule=Host(`${MEMBER_SITE_HOST}`)
      - traefik.http.routers.openpool-member.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.openpool-member.tls=true
      - traefik.http.routers.openpool-member.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.openpool-member.service=openpool-member
      - traefik.http.services.openpool-member.loadbalancer.server.port=8080

  admin:
    <<: *site
    image: ${ADMIN_IMAGE}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.openpool-admin.rule=Host(`${ADMIN_SITE_HOST}`)
      - traefik.http.routers.openpool-admin.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.openpool-admin.tls=true
      - traefik.http.routers.openpool-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.openpool-admin.service=openpool-admin
      - traefik.http.services.openpool-admin.loadbalancer.server.port=8080

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

# The public site: every page is a file. A path that is no page is answered
# with the not-found page and status 404, so search engines do not index it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The web app manifest, a type nginx's own table does not list.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }
}
